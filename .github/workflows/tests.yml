name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, gd, pdo_sqlite, sqlite3, intl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          printf 'APP_ENV=testing\nAPP_KEY=\nDB_CONNECTION=sqlite\nDB_DATABASE=:memory:\n' > .env
          php artisan key:generate --no-interaction

      - name: Run tests
        run: php artisan test
